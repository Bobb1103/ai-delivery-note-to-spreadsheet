<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手写送货单电子化工具</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
            background-color: #f7f9fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }
        input:focus, button:focus, select:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.4);
        }
    </style>
</head>
<body class="p-4 sm:p-8">

    <div id="app" class="w-full max-w-4xl bg-white shadow-2xl rounded-xl p-6 md:p-10 border border-gray-100">
        <header class="text-center mb-8 relative">
            <span id="jsStatusBadge" class="absolute right-0 top-0 text-xs px-2 py-1 rounded bg-red-100 text-red-600">⏳ 脚本加载中</span>
            <h1 class="text-3xl font-extrabold text-indigo-700 border-b-2 border-indigo-100 pb-3 mb-2">手写送货单电子化助手</h1>
            <p class="text-gray-600">自动提取纯尺寸规格、在线微调核对、一键导出税务局标准导入模板。</p>
        </header>

        <!-- API Key 设置区 -->
        <section id="apiKeySection" class="mb-8 p-6 bg-yellow-50 border border-yellow-300 rounded-lg shadow-inner">
            <h2 class="text-xl font-semibold text-yellow-800 mb-4">🔑 设置 API 密钥</h2>
            <p class="text-sm text-yellow-700 mb-4">密钥仅保存在您的本地浏览器中，不会上传到任何第三方服务器。</p>
            <div class="flex flex-col gap-3">
                <div class="relative">
                    <input type="password" id="apiKeyInput" placeholder="请粘贴您的 Gemini API Key" 
                        class="w-full p-3 pr-12 border border-yellow-300 rounded-lg focus:ring-2 focus:ring-yellow-500 outline-none">
                    <button type="button" onclick="window.toggleKey()" id="toggleKeyVisible" class="absolute right-3 top-3 text-gray-500 hover:text-gray-700 text-sm">
                        👁️
                    </button>
                </div>
                <button type="button" onclick="window.saveApiKey()" id="saveKeyButton" class="w-full py-2 bg-yellow-600 text-white font-bold rounded-lg hover:bg-yellow-700 transition duration-150">
                    保存密钥并开始使用
                </button>
            </div>
        </section>

        <!-- 主要应用内容 -->
        <div id="mainContent" class="hidden">
            
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center gap-2">
                    <label for="taxRateSelect" class="text-xs font-semibold text-gray-600">发票默认税率：</label>
                    <select id="taxRateSelect" class="text-xs border border-gray-300 rounded px-2 py-1 bg-white">
                        <option value="0.13">13% (0.13)</option>
                        <option value="0.03">3% (0.03)</option>
                        <option value="0.01">1% (0.01)</option>
                        <option value="0">免税/0% (0)</option>
                    </select>
                </div>
                <button type="button" onclick="window.resetApiKey()" class="text-xs text-gray-400 hover:text-indigo-600 underline transition duration-150">
                    重置/更换 API 密钥
                </button>
            </div>

            <!-- 步骤 1: 图片上传 -->
            <section class="mb-8 p-6 bg-indigo-50 border border-indigo-200 rounded-lg shadow-md">
                <h2 class="text-xl font-semibold text-indigo-800 mb-4">第一步：上传手写送货单照片 (可多选)</h2>
                <div class="flex flex-col sm:flex-row gap-4">
                    <input type="file" id="imageInput" accept="image/*" multiple onchange="window.onFilesSelected(this)"
                        class="flex-grow text-sm text-gray-700
                        file:mr-4 file:py-2 file:px-4
                        file:rounded-full file:border-0
                        file:text-sm file:font-semibold
                        file:bg-indigo-200 file:text-indigo-800
                        hover:file:bg-indigo-300 transition duration-150"
                    />
                    <button type="button" id="clearImageButton" onclick="window.resetAll()"
                            class="px-4 py-2 bg-red-500 text-white font-medium rounded-lg text-sm hover:bg-red-600 transition duration-150 disabled:opacity-50"
                            disabled>
                        🗑️ 清除所有图片
                    </button>
                </div>
            </section>

            <!-- 步骤 2: 处理与指示 -->
            <section class="mb-8">
                <button type="button" id="processButton" onclick="window.startProcess()"
                        class="w-full py-3 bg-indigo-600 text-white font-bold rounded-lg shadow-lg hover:bg-indigo-700 transition duration-150 disabled:opacity-50"
                        disabled>
                    开始极速识别并转化
                </button>
                <div id="loadingIndicator" class="mt-4 p-3 text-center rounded-lg bg-indigo-50 border border-indigo-200 hidden">
                    <div class="animate-spin inline-block w-5 h-5 border-2 border-indigo-500 border-t-transparent rounded-full"></div>
                    <span id="loadingMessage" class="ml-3 text-indigo-600 font-medium">正在读取图片，请稍候...</span>
                </div>
                <div id="messageBox" class="mt-4 p-3 rounded-lg text-sm font-medium hidden"></div>
            </section>

            <!-- 步骤 3: 结果与导出 -->
            <section id="resultsSection" class="hidden">
                <div class="flex justify-between items-center mb-4 border-b pb-2">
                    <h2 class="text-xl font-semibold text-gray-800">📦 汇总识别结果表格 (点击单元格可直接修改)</h2>
                </div>
                
                <div id="tableOutput" class="overflow-x-auto mb-4 border border-gray-200 rounded-lg shadow-md"></div>

                <div class="flex flex-col sm:flex-row gap-3">
                    <button type="button" onclick="window.exportTaxExcel()"
                            class="flex-1 py-3 bg-green-600 text-white font-bold rounded-lg hover:bg-green-700 transition duration-150 shadow-md">
                        📊 导出税务发票模板 (发票开具项目信息导入.xlsx)
                    </button>
                    <button type="button" onclick="window.exportCsv()"
                            class="py-3 px-6 bg-gray-600 text-white font-medium rounded-lg hover:bg-gray-700 transition duration-150">
                        ⬇️ 导出常规 CSV
                    </button>
                </div>
            </section>

            <!-- 步骤 4: 预览 -->
            <section id="previewSection" class="mt-8 border-t border-gray-200 pt-6 hidden">
                <h2 class="text-lg font-semibold text-gray-700 mb-2">首张图片预览</h2>
                <img id="imagePreview" class="max-w-full h-auto rounded-lg shadow-lg border border-gray-300" />
            </section>
        </div>
    </div>

    <script>
        var appState = {
            apiKey: "",
            files: [],
            extractedItems: [],
            isProcessing: false,
            modelPool: []
        };

        function el(id) {
            return document.getElementById(id);
        }

        function sleep(ms) {
            return new Promise(function(resolve) {
                setTimeout(resolve, ms);
            });
        }

        function showMessage(message, type) {
            var box = el('messageBox');
            box.textContent = message;
            box.className = 'mt-4 p-3 rounded-lg text-sm font-medium';
            if (type === 'error') {
                box.classList.add('bg-red-100', 'text-red-700');
            } else if (type === 'success') {
                box.classList.add('bg-green-100', 'text-green-700');
            } else {
                box.classList.add('bg-blue-100', 'text-blue-700');
            }
        }

        window.toggleKey = function() {
            var inp = el('apiKeyInput');
            var btn = el('toggleKeyVisible');
            if (inp.type === 'password') {
                inp.type = 'text';
                btn.textContent = '🔒';
            } else {
                inp.type = 'password';
                btn.textContent = '👁️';
            }
        };

        window.saveApiKey = function() {
            var inp = el('apiKeyInput');
            var raw = inp.value || "";
            var cleaned = raw.split(' ').join('').split('\n').join('').split('\r').join('').trim();
            if (cleaned.length >= 15) {
                localStorage.setItem('GEMINI_API_KEY', cleaned);
                appState.apiKey = cleaned;
                appState.modelPool = [];
                el('apiKeySection').classList.add('hidden');
                el('mainContent').classList.remove('hidden');
                showMessage('密钥已保存到本地浏览器，请上传送货单照片。', 'success');
            } else {
                alert('请输入有效的 API Key（请检查是否完整复制）');
            }
        };

        window.resetApiKey = function() {
            if (confirm('确定要清除本地保存的 API 密钥吗？')) {
                localStorage.removeItem('GEMINI_API_KEY');
                appState.apiKey = "";
                appState.modelPool = [];
                el('apiKeyInput').value = "";
                window.resetAll();
                el('mainContent').classList.add('hidden');
                el('apiKeySection').classList.remove('hidden');
            }
        };

        window.resetAll = function() {
            appState.files = [];
            appState.extractedItems = [];
            appState.isProcessing = false;
            el('imageInput').value = '';
            el('processButton').disabled = true;
            el('clearImageButton').disabled = true;
            el('previewSection').classList.add('hidden');
            el('resultsSection').classList.add('hidden');
            el('loadingIndicator').classList.add('hidden');
            el('tableOutput').innerHTML = '';
            el('messageBox').classList.add('hidden');
        };

        window.onFilesSelected = function(input) {
            appState.files = Array.prototype.slice.call(input.files || []);
            el('messageBox').classList.add('hidden');
            if (appState.files.length > 0) {
                el('processButton').disabled = false;
                el('clearImageButton').disabled = false;
                var reader = new FileReader();
                reader.onload = function(e) {
                    el('imagePreview').src = e.target.result;
                    el('previewSection').classList.remove('hidden');
                };
                reader.readAsDataURL(appState.files[0]);
                showMessage('已选择 ' + appState.files.length + ' 张图片，请点击开始极速识别。', 'info');
            } else {
                window.resetAll();
            }
        };

        // 清洗规格：去除材质及工艺名称（如 PE、FPP、双印），只留纯数字尺寸
        function cleanSpecString(spec) {
            if (!spec) return "";
            var s = String(spec).trim();
            var idx = -1;
            for (var i = 0; i < s.length; i++) {
                var ch = s.charAt(i);
                if (ch >= '0' && ch <= '9') {
                    idx = i;
                    break;
                }
            }
            if (idx > 0) {
                s = s.substring(idx).trim();
            }
            s = s.split('x').join('*').split('X').join('*').split('×').join('*');
            return s;
        }

        function compressImage(file) {
            var maxDim = 1600;
            var quality = 0.85;
            return new Promise(function(resolve) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    var raw = e.target.result;
                    var fallback = function() {
                        resolve({ base64Data: raw.split(',')[1], mimeType: file.type || 'image/jpeg' });
                    };
                    var img = new Image();
                    img.onload = function() {
                        try {
                            var w = img.width;
                            var h = img.height;
                            if (w > maxDim || h > maxDim) {
                                if (w > h) {
                                    h = Math.round((h * maxDim) / w);
                                    w = maxDim;
                                } else {
                                    w = Math.round((w * maxDim) / h);
                                    h = maxDim;
                                }
                            }
                            var canvas = document.createElement('canvas');
                            canvas.width = w;
                            canvas.height = h;
                            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                            var url = canvas.toDataURL('image/jpeg', quality);
                            resolve({ base64Data: url.split(',')[1], mimeType: 'image/jpeg' });
                        } catch (err) {
                            fallback();
                        }
                    };
                    img.onerror = fallback;
                    img.src = raw;
                };
                reader.onerror = function() {
                    resolve({ base64Data: '', mimeType: 'image/jpeg' });
                };
                reader.readAsDataURL(file);
            });
        }

        window.updateCell = function(idx, field, val) {
            if (field === 'quantity' || field === 'unitPrice') {
                appState.extractedItems[idx][field] = Number(val) || 0;
                var amt = (appState.extractedItems[idx].quantity * appState.extractedItems[idx].unitPrice).toFixed(2);
                el('amt-' + idx).textContent = '¥' + amt;
            } else {
                appState.extractedItems[idx][field] = val;
            }
        };

        function renderTable(items) {
            var html = '<table class="min-w-full divide-y divide-gray-200">' +
                '<thead class="bg-indigo-100"><tr>' +
                '<th class="px-3 py-3 text-left text-xs font-semibold text-indigo-700">送货单号</th>' +
                '<th class="px-3 py-3 text-left text-xs font-semibold text-indigo-700">开票品名</th>' +
                '<th class="px-3 py-3 text-left text-xs font-semibold text-indigo-700">规格型号</th>' +
                '<th class="px-3 py-3 text-left text-xs font-semibold text-indigo-700">单位</th>' +
                '<th class="px-3 py-3 text-right text-xs font-semibold text-indigo-700">数量</th>' +
                '<th class="px-3 py-3 text-right text-xs font-semibold text-indigo-700">单价</th>' +
                '<th class="px-3 py-3 text-right text-xs font-semibold text-indigo-700">金额(数量×单价)</th>' +
                '</tr></thead><tbody class="bg-white divide-y divide-gray-200">';

            for (var i = 0; i < items.length; i++) {
                var item = items[i];
                var q = Number(item.quantity) || 0;
                var p = Number(item.unitPrice) || 0;
                var amt = (q * p).toFixed(2);
                var rowBg = i % 2 === 0 ? 'bg-white' : 'bg-gray-50';
                var pBorder = item.isPriceCertain === false ? 'border-red-400 bg-red-50 text-red-700 font-bold' : 'border-transparent hover:border-gray-300';

                html += '<tr class="' + rowBg + ' hover:bg-indigo-50">' +
                    '<td class="px-3 py-2 text-sm"><input type="text" oninput="window.updateCell(' + i + ',\'deliveryNo\',this.value)" value="' + (item.deliveryNo || '') + '" class="w-24 bg-transparent border border-transparent hover:border-gray-300 rounded px-1 text-blue-600 font-medium" /></td>' +
                    '<td class="px-3 py-2 text-sm font-semibold text-gray-800">胶袋</td>' +
                    '<td class="px-3 py-2 text-sm"><input type="text" oninput="window.updateCell(' + i + ',\'nameAndSpec\',this.value)" value="' + (item.nameAndSpec || '') + '" class="w-36 bg-transparent border border-transparent hover:border-gray-300 rounded px-1 text-gray-700" /></td>' +
                    '<td class="px-3 py-2 text-sm"><input type="text" oninput="window.updateCell(' + i + ',\'unit\',this.value)" value="' + (item.unit || '只') + '" class="w-12 bg-transparent border border-transparent hover:border-gray-300 rounded px-1 text-gray-600" /></td>' +
                    '<td class="px-3 py-2 text-sm text-right"><input type="number" step="any" oninput="window.updateCell(' + i + ',\'quantity\',this.value)" value="' + q + '" class="w-20 text-right bg-transparent border border-transparent hover:border-gray-300 rounded px-1 text-gray-700" /></td>' +
                    '<td class="px-3 py-2 text-sm text-right"><input type="number" step="any" oninput="window.updateCell(' + i + ',\'unitPrice\',this.value)" value="' + p + '" class="w-20 text-right bg-transparent border ' + pBorder + ' rounded px-1" /></td>' +
                    '<td id="amt-' + i + '" class="px-3 py-2 text-sm text-right text-indigo-600 font-semibold">¥' + amt + '</td>' +
                    '</tr>';
            }
            html += '</tbody></table>';
            el('tableOutput').innerHTML = html;
        }

        async function getModelPool() {
            if (appState.modelPool.length > 0) return appState.modelPool;
            var pool = [];
            try {
                var res = await fetch('https://generativelanguage.googleapis.com/v1beta/models?key=' + appState.apiKey);
                if (res.ok) {
                    var data = await res.json();
                    var list = data.models || [];
                    var badKw = ["2.0-flash-lite", "gemini-2.5-flash", "gemini-1.5", "gemini-1.0", "thinking", "audio", "tts", "exp", "embedding", "imagen", "veo", "gemma"];
                    for (var i = 0; i < list.length; i++) {
                        var m = list[i];
                        var methods = m.supportedGenerationMethods || [];
                        var name = (m.name || "").replace("models/", "");
                        var isBad = false;
                        for (var k = 0; k < badKw.length; k++) {
                            if (name.indexOf(badKw[k]) !== -1) { isBad = true; break; }
                        }
                        if (methods.indexOf("generateContent") !== -1 && name.indexOf("gemini-") === 0 && !isBad) {
                            pool.push(name);
                        }
                    }
                }
            } catch (e) {}

            pool.sort(function(a, b) {
                return (a.indexOf('flash') !== -1 ? 1 : 2) - (b.indexOf('flash') !== -1 ? 1 : 2);
            });

            var fallbacks = ["gemini-3.6-flash", "gemini-3.5-flash-lite", "gemini-3.6-pro"];
            for (var f = 0; f < fallbacks.length; f++) {
                if (pool.indexOf(fallbacks[f]) === -1) pool.push(fallbacks[f]);
            }
            appState.modelPool = pool;
            return pool;
        }

        async function callGeminiAPI(base64Data, mimeType, modelIndex, retryCount) {
            modelIndex = modelIndex || 0;
            retryCount = retryCount || 0;
            var models = await getModelPool();
            if (modelIndex >= models.length) {
                throw new Error("当前 Google 所有模型节点均在高负载排队 (503)，请稍等 10 秒再试。");
            }
            var modelName = models[modelIndex];
            var url = 'https://generativelanguage.googleapis.com/v1beta/models/' + modelName + ':generateContent?key=' + appState.apiKey;

            var promptText = '你是送货单识别助手。请提取图片中的送货单号以及每行货物的“纯尺寸规格”、“单位”、“数量”、“单价”。\n' +
                '规则：\n' +
                '1. 规格型号：【绝对不要包含PE、PPE、OPP、FPP、双印、防水袋等材质或工艺文字】，只提取尺寸数字，乘号统一用 *（例如 26.5*37+5+2.5）。\n' +
                '2. 不提取货号，不提取手写金额。\n' +
                '3. 直接返回纯JSON，格式：{"deliveryNo":"5118928","items":[{"nameAndSpec":"26.5*37+5+2.5","unit":"只","quantity":8400,"unitPrice":0.27,"isPriceCertain":true}]}';

            var payload = {
                contents: [{
                    role: "user",
                    parts: [
                        { text: promptText },
                        { inlineData: { mimeType: mimeType || 'image/jpeg', data: base64Data } }
                    ]
                }]
            };

            var res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!res.ok) {
                var st = res.status;
                if (st === 503 || st === 429 || st === 500) {
                    if (retryCount < 1) {
                        el('loadingMessage').textContent = '节点 (' + modelName + ') 繁忙 (' + st + ')，自动重连中...';
                        await sleep(1500);
                        return callGeminiAPI(base64Data, mimeType, modelIndex, retryCount + 1);
                    } else if (modelIndex + 1 < models.length) {
                        el('loadingMessage').textContent = '主节点拥堵，自动分流至备用节点 (' + models[modelIndex + 1] + ')...';
                        await sleep(500);
                        return callGeminiAPI(base64Data, mimeType, modelIndex + 1, 0);
                    }
                }
                if ((st === 404 || st === 400) && modelIndex + 1 < models.length) {
                    return callGeminiAPI(base64Data, mimeType, modelIndex + 1, 0);
                }
                var errText = await res.text();
                throw new Error('HTTP ' + st + ' (' + errText + ')');
            }

            var data = await res.json();
            var rawText = data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0].text;
            if (!rawText) throw new Error("模型未返回文本");

            // 安全剥离反引号（不使用字面量反引号防粘贴解析出错）
            var tick3 = String.fromCharCode(96, 96, 96);
            var cleanJson = rawText.split(tick3 + 'json').join('').split(tick3 + 'JSON').join('').split(tick3).join('').trim();
            var parsed = JSON.parse(cleanJson);

            var dNo = parsed.deliveryNo || parsed.orderNo || "";
            var list = Array.isArray(parsed) ? parsed : (parsed.items || parsed.details || []);
            var resultItems = [];

            for (var i = 0; i < list.length; i++) {
                var it = list[i];
                var spec = cleanSpecString(it.nameAndSpec || it.spec || "");
                if (spec) {
                    resultItems.push({
                        deliveryNo: it.deliveryNo || dNo,
                        nameAndSpec: spec,
                        unit: it.unit || "只",
                        quantity: Number(it.quantity) || 0,
                        unitPrice: Number(it.unitPrice) || 0,
                        isPriceCertain: it.isPriceCertain !== false
                    });
                }
            }
            return resultItems;
        }

        window.startProcess = async function() {
            if (appState.isProcessing || appState.files.length === 0) return;
            appState.isProcessing = true;
            appState.extractedItems = [];
            el('processButton').disabled = true;
            el('clearImageButton').disabled = true;
            el('resultsSection').classList.add('hidden');
            el('loadingIndicator').classList.remove('hidden');
            el('messageBox').classList.add('hidden');

            var total = appState.files.length;
            var errors = [];

            for (var i = 0; i < total; i++) {
                var file = appState.files[i];
                el('loadingMessage').textContent = '正在识别第 ' + (i + 1) + ' / ' + total + ' 张图片 (' + file.name + ')...';
                try {
                    var imgData = await compressImage(file);
                    var items = await callGeminiAPI(imgData.base64Data, imgData.mimeType, 0, 0);
                    if (items.length > 0) {
                        for (var k = 0; k < items.length; k++) appState.extractedItems.push(items[k]);
                    } else {
                        errors.push('第 ' + (i + 1) + ' 张未提取到条目');
                    }
                } catch (err) {
                    errors.push('第 ' + (i + 1) + ' 张出错: ' + err.message);
                }
                if (i < total - 1) await sleep(800);
            }

            appState.extractedItems.sort(function(a, b) {
                return (parseInt(a.deliveryNo, 10) || 0) - (parseInt(b.deliveryNo, 10) || 0);
            });

            el('loadingIndicator').classList.add('hidden');
            appState.isProcessing = false;
            el('processButton').disabled = false;
            el('clearImageButton').disabled = false;

            if (appState.extractedItems.length > 0) {
                renderTable(appState.extractedItems);
                el('resultsSection').classList.remove('hidden');
                if (errors.length > 0) {
                    showMessage('部分完成，提取 ' + appState.extractedItems.length + ' 条。异常：' + errors.join('；'), 'info');
                } else {
                    showMessage('全部识别完成！共汇总 ' + appState.extractedItems.length + ' 条明细。', 'success');
                }
            } else {
                showMessage('识别失败：' + errors.join('；'), 'error');
            }
        };

        window.exportTaxExcel = function() {
            if (typeof XLSX === 'undefined') {
                alert('Excel 导出库加载未完成，请检查网络后刷新重试。');
                return;
            }
            var taxRate = el('taxRateSelect').value;
            var items = appState.extractedItems;
            if (!items || items.length === 0) return;

            var wb = XLSX.utils.book_new();
            var sheetData = [
                ["填表说明：\n1、项目名称：无需写商品和服务税收分类简称（*号以及中间内容）。\n2、导入前请在电子税务局【开票业务】-【开票信息维护】中对开具的项目信息进行维护，或在导入模板中填写“商品与服务税收分类编码”。\n3、数量、单价可任填其中一项，或者仅填金额；如果三项均填写，导入后系统将默认以填写的数量*单价=金额进行误差校验；\n商品单价、商品数量：小数点后最多保留13位小数；\n金额：小数点后最多保留2位小数。"],
                ["必填\n(限100字符)", "非必填\n(限19字符)", "非必填\n(限40字符)", "非必填\n(限20字符)", "非必填\n(限16字符)", "非必填\n(限16字符)\t", "必填\n(限18字符)\n(保留两位小数)", "必填\n(以小数后两位形式填写，如“0.13”代\n表税率13%)", "非必填\n(限18字符)\n保留两位小数", "非必填\n（限15字符)", "非必填\n（限15字符)   "],
                ["项目名称", "商品和服务税收分类编码", "规格型号", "单位", "商品数量", "商品单价", "金额", "税率", "折扣金额", "优惠政策类型", "煤炭种类"]
            ];

            for (var i = 0; i < items.length; i++) {
                var it = items[i];
                var q = Number(it.quantity) || 0;
                var p = Number(it.unitPrice) || 0;
                var amt = Number((q * p).toFixed(2));
                sheetData.push(["胶袋", "", it.nameAndSpec || "", it.unit || "只", q, p, amt, taxRate, "", taxRate === "0" ? "免税" : "", ""]);
            }

            XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sheetData), "1-明细模板");
            XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([[""], [""], [""], ["mx;20250501"]]), "excelVersion");
            XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([["北京市怀柔区"], ["北京市平谷区"], ["北京市昌平区"], ["北京市大兴区"]]), "xzqhdm");
            XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([
                ["不动产销售说明", null, null, null, null, null, null, null, null, "不动产租赁说明"],
                ["非必填\n（限40字符)", "必填\n合计（限120字符)", null, "非必填\n（限28字符)", "非必填\n（限20字符)", "非必填\n（限20字符)\t", "必填\n\t（限20字符)", "必填(是/否)\n\t（限2字符)", "必填\n\t（限12字符)", "必填\n（限40字符)\t"],
                ["产权证书/不动产权证号码", "不动产地址", "不动产详细地址", "不动产单元代码/网签合同备案编码", "土地增值税项目编号", "核定计税价格", "实际成交含税金额", "跨地市标志", "面积单位", "产权证书/不动产权证号码"]
            ]), "2-特定业务信息");

            XLSX.writeFile(wb, "发票开具项目信息导入.xlsx");
            showMessage('发票导入模板 Excel 已下载。', 'success');
        };

        window.exportCsv = function() {
            var items = appState.extractedItems;
            var csv = "送货单号,项目名称,规格型号,单位,数量,单价,金额\n";
            for (var i = 0; i < items.length; i++) {
                var it = items[i];
                var q = Number(it.quantity) || 0;
                var p = Number(it.unitPrice) || 0;
                csv += '"' + (it.deliveryNo || '-') + '","胶袋","' + (it.nameAndSpec || '-') + '",' + (it.unit || '只') + ',' + q + ',' + p + ',' + (q * p).toFixed(2) + '\n';
            }
            var blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' });
            var a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = '送货单汇总数据.csv';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        };

        // 初始化页面状态并点亮绿色“脚本就绪”标签
        (function init() {
            var badge = el('jsStatusBadge');
            if (badge) {
                badge.textContent = '✅ 脚本就绪';
                badge.className = 'absolute right-0 top-0 text-xs px-2 py-1 rounded bg-green-100 text-green-700 font-medium';
            }
            var saved = localStorage.getItem('GEMINI_API_KEY');
            if (saved && saved.trim().length >= 15) {
                appState.apiKey = saved.trim();
                el('apiKeySection').classList.add('hidden');
                el('mainContent').classList.remove('hidden');
            }
        })();
    </script>
</body>
