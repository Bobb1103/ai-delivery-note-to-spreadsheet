<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手写送货单电子化工具</title>
    
    <!-- Tailwind CSS (界面样式库) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS (Excel 原版模板读写库) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
            background-color: #f7f9fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }
        input:focus, button:focus, select:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.4);
        }
    </style>
</head>
<body class="p-4 sm:p-8">

    <div id="app" class="w-full max-w-4xl bg-white shadow-2xl rounded-xl p-6 md:p-10 border border-gray-100">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-indigo-700 border-b-2 border-indigo-100 pb-3 mb-2">手写送货单电子化助手</h1>
            <p class="text-gray-600">自动提取纯尺寸规格、在线微调核对、一键导出税务局标准导入模板。</p>
        </header>

        <!-- 全局脚本错误提示区（防止静默白屏） -->
        <div id="fatalErrorBox" class="mb-6 p-4 bg-red-100 border border-red-400 text-red-800 rounded-lg text-sm hidden"></div>

        <!-- API Key 设置区 -->
        <section id="apiKeySection" class="mb-8 p-6 bg-yellow-50 border border-yellow-300 rounded-lg shadow-inner hidden">
            <h2 class="text-xl font-semibold text-yellow-800 mb-4">🔑 设置 API 密钥</h2>
            <p class="text-sm text-yellow-700 mb-4">密钥仅保存在您的本地浏览器中，不会上传到任何第三方服务器。</p>
            <div class="flex flex-col gap-3">
                <div class="relative">
                    <input type="password" id="apiKeyInput" placeholder="请粘贴您的 Gemini API Key" 
                        class="w-full p-3 pr-12 border border-yellow-300 rounded-lg focus:ring-2 focus:ring-yellow-500 outline-none">
                    <button type="button" id="toggleKeyVisible" class="absolute right-3 top-3 text-gray-500 hover:text-gray-700 text-sm">
                        👁️
                    </button>
                </div>
                <button type="button" id="saveKeyButton" class="w-full py-2 bg-yellow-600 text-white font-bold rounded-lg hover:bg-yellow-700 transition duration-150">
                    保存密钥并开始使用
                </button>
            </div>
        </section>

        <!-- 主要应用内容 -->
        <div id="mainContent" class="hidden">
            
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center gap-2">
                    <label for="taxRateSelect" class="text-xs font-semibold text-gray-600">发票默认税率：</label>
                    <select id="taxRateSelect" class="text-xs border border-gray-300 rounded px-2 py-1 bg-white">
                        <option value="0.13">13% (0.13)</option>
                        <option value="0.03">3% (0.03)</option>
                        <option value="0.01">1% (0.01)</option>
                        <option value="0">免税/0% (0)</option>
                    </select>
                </div>
                <button type="button" id="resetKeyButton" class="text-xs text-gray-400 hover:text-indigo-600 underline transition duration-150">
                    重置/更换 API 密钥
                </button>
            </div>

            <!-- 步骤 1: 图片上传 -->
            <section class="mb-8 p-6 bg-indigo-50 border border-indigo-200 rounded-lg shadow-md">
                <h2 class="text-xl font-semibold text-indigo-800 mb-4">第一步：上传手写送货单照片 (可多选)</h2>
                <div class="flex flex-col sm:flex-row gap-4">
                    <input type="file" id="imageInput" accept="image/*" multiple
                        class="flex-grow text-sm text-gray-700
                        file:mr-4 file:py-2 file:px-4
                        file:rounded-full file:border-0
                        file:text-sm file:font-semibold
                        file:bg-indigo-200 file:text-indigo-800
                        hover:file:bg-indigo-300 transition duration-150"
                    />
                    <button type="button" id="clearImageButton"
                            class="px-4 py-2 bg-red-500 text-white font-medium rounded-lg text-sm hover:bg-red-600 transition duration-150 disabled:opacity-50"
                            disabled>
                        🗑️ 清除所有图片
                    </button>
                </div>
            </section>

            <!-- 步骤 2: 处理与指示 -->
            <section class="mb-8">
                <button type="button" id="processButton"
                        class="w-full py-3 bg-indigo-600 text-white font-bold rounded-lg shadow-lg hover:bg-indigo-700 transition duration-150 disabled:opacity-50"
                        disabled>
                    开始极速识别并转化
                </button>
                <div id="loadingIndicator" class="mt-4 p-3 text-center rounded-lg bg-indigo-50 border border-indigo-200 hidden">
                    <div class="animate-spin inline-block w-5 h-5 border-2 border-indigo-500 border-t-transparent rounded-full"></div>
                    <span id="loadingMessage" class="ml-3 text-indigo-600 font-medium">正在读取图片，请稍候...</span>
                </div>
                <div id="messageBox" class="mt-4 p-3 rounded-lg text-sm font-medium hidden"></div>
            </section>

            <!-- 步骤 3: 结果与导出 -->
            <section id="resultsSection" class="hidden">
                <div class="flex justify-between items-center mb-4 border-b pb-2">
                    <h2 class="text-xl font-semibold text-gray-800">📦 汇总识别结果表格 (点击单元格可直接修改)</h2>
                </div>
                
                <div id="tableOutput" class="overflow-x-auto mb-4 border border-gray-200 rounded-lg shadow-md">
                    <!-- 表格动态生成 -->
                </div>

                <div class="flex flex-col sm:flex-row gap-3">
                    <button type="button" id="exportExcelButton"
                            class="flex-1 py-3 bg-green-600 text-white font-bold rounded-lg hover:bg-green-700 transition duration-150 shadow-md">
                        📊 导出税务发票模板 (发票开具项目信息导入.xlsx)
                    </button>
                    <button type="button" id="exportCsvButton"
                            class="py-3 px-6 bg-gray-600 text-white font-medium rounded-lg hover:bg-gray-700 transition duration-150">
                        ⬇️ 导出常规 CSV
                    </button>
                </div>
            </section>

            <!-- 步骤 4: 预览 -->
            <section id="previewSection" class="mt-8 border-t border-gray-200 pt-6 hidden">
                <h2 class="text-lg font-semibold text-gray-700 mb-2">首张图片预览</h2>
                <img id="imagePreview" class="max-w-full h-auto rounded-lg shadow-lg border border-gray-300" />
            </section>
        </div>
    </div>

    <script>
        // 全局异常监听：确保任何脚本异常都能直接显示在界面上
        window.onerror = function(msg, url, lineNo) {
            var box = document.getElementById('fatalErrorBox');
            if (box) {
                box.textContent = "页面脚本运行异常 (第 " + lineNo + " 行): " + msg;
                box.classList.remove('hidden');
            }
            return false;
        };

        // 应用全局状态管理
        var appState = {
            apiKey: "",
            files: [],
            extractedItems: [],
            isProcessing: false,
            modelPool: []
        };

        // 集中获取页面 DOM 元素
        var D = {
            apiKeySection: document.getElementById('apiKeySection'),
            apiKeyInput: document.getElementById('apiKeyInput'),
            toggleKeyVisible: document.getElementById('toggleKeyVisible'),
            saveKeyButton: document.getElementById('saveKeyButton'),
            resetKeyButton: document.getElementById('resetKeyButton'),
            mainContent: document.getElementById('mainContent'),
            taxRateSelect: document.getElementById('taxRateSelect'),
            imageInput: document.getElementById('imageInput'),
            clearImageButton: document.getElementById('clearImageButton'),
            processButton: document.getElementById('processButton'),
            loadingIndicator: document.getElementById('loadingIndicator'),
            loadingMessage: document.getElementById('loadingMessage'),
            tableOutput: document.getElementById('tableOutput'),
            exportExcelButton: document.getElementById('exportExcelButton'),
            exportCsvButton: document.getElementById('exportCsvButton'),
            messageBox: document.getElementById('messageBox'),
            resultsSection: document.getElementById('resultsSection'),
            imagePreview: document.getElementById('imagePreview'),
            previewSection: document.getElementById('previewSection')
        };

        // 延时辅助函数
        function sleep(ms) {
            return new Promise(function(resolve) {
                setTimeout(resolve, ms);
            });
        }

        // 初始化本地密钥检测
        function initKeySystem() {
            var storedKey = localStorage.getItem('GEMINI_API_KEY');
            if (storedKey && storedKey.trim().length > 10) {
                appState.apiKey = storedKey.trim();
                showMainContent();
            } else {
                showKeySetup();
            }
        }

        function showKeySetup() {
            D.apiKeySection.classList.remove('hidden');
            D.mainContent.classList.add('hidden');
        }

        function showMainContent() {
            D.apiKeySection.classList.add('hidden');
            D.mainContent.classList.remove('hidden');
        }

        // 显示状态提示信息
        function showMessage(message, type) {
            D.messageBox.textContent = message;
            D.messageBox.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700', 'bg-blue-100', 'text-blue-700');

            if (type === 'error') {
                D.messageBox.classList.add('bg-red-100', 'text-red-700');
            } else if (type === 'success') {
                D.messageBox.classList.add('bg-green-100', 'text-green-700');
            } else {
                D.messageBox.classList.add('bg-blue-100', 'text-blue-700');
            }
            D.messageBox.classList.remove('hidden');
        }

        // 重置页面状态
        function resetApp() {
            appState.files = [];
            appState.extractedItems = [];
            appState.isProcessing = false;
            
            D.imageInput.value = '';
            D.processButton.disabled = true;
            D.clearImageButton.disabled = true;
            
            D.previewSection.classList.add('hidden');
            D.resultsSection.classList.add('hidden');
            D.loadingIndicator.classList.add('hidden');
            
            D.tableOutput.innerHTML = '';
            D.messageBox.classList.add('hidden');
            if (appState.apiKey) {
                showMessage('请选择一张或多张送货单图片开始处理。', 'info');
            }
        }

        // 清洗规格：去除材质及工艺名称（如 PE、FPP、双印等），仅保留纯数字尺寸
        function cleanSpecString(spec) {
            if (!spec) return "";
            var s = String(spec).trim();
            // 定位到第一个数字（0-9）出现的位置并截取后续纯尺寸
            var firstDigitIndex = s.search(/[0-9]/);
            if (firstDigitIndex > 0) {
                s = s.substring(firstDigitIndex).trim();
            }
            // 将各种乘号统一替换为半角星号 *
            s = s.replace(/[xX×]/g, '*');
            return s;
        }

        // 前端图片等比缩放与压缩（解决手机原图体积过大导致超时问题）
        function compressAndConvertToBase64(file) {
            var maxDimension = 1600;
            var quality = 0.85;
            return new Promise(function(resolve) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    var rawResult = e.target.result;
                    var fallback = function() {
                        var parts = rawResult.split(',');
                        resolve({
                            base64Data: parts[1],
                            mimeType: file.type || 'image/jpeg'
                        });
                    };

                    var img = new Image();
                    img.onload = function() {
                        try {
                            var width = img.width;
                            var height = img.height;
                            if (width > maxDimension || height > maxDimension) {
                                if (width > height) {
                                    height = Math.round((height * maxDimension) / width);
                                    width = maxDimension;
                                } else {
                                    width = Math.round((width * maxDimension) / height);
                                    height = maxDimension;
                                }
                            }

                            var canvas = document.createElement('canvas');
                            canvas.width = width;
                            canvas.height = height;
                            var ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);

                            var dataUrl = canvas.toDataURL('image/jpeg', quality);
                            resolve({
                                base64Data: dataUrl.split(',')[1],
                                mimeType: 'image/jpeg'
                            });
                        } catch (err) {
                            fallback();
                        }
                    };
                    img.onerror = fallback;
                    img.src = rawResult;
                };
                reader.onerror = function() {
                    resolve({ base64Data: '', mimeType: 'image/jpeg' });
                };
                reader.readAsDataURL(file);
            });
        }

        // 渲染可直接在页面微调数据的汇总表格
        function renderTable(items) {
            if (!items || items.length === 0) {
                D.tableOutput.innerHTML = '<p class="text-center text-gray-500 p-4">未提取到任何有效数据。</p>';
                return;
            }

            var html = '<table class="min-w-full divide-y divide-gray-200">' +
                '<thead class="bg-indigo-100">' +
                '<tr>' +
                '<th class="px-3 py-3 text-left text-xs font-semibold text-indigo-700 uppercase">送货单号
